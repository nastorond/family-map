services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # 컨테이너 실행 uid:gid. NAS에서는 data 폴더 주인(예: 시놀로지 계정 1026:100)으로 맞춘다.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      # SQLite 파일 위치. NAS 백업은 이 폴더를 대상으로 잡는다.
      # 위 user가 이 폴더에 쓸 수 있어야 한다.
      - ./data:/data
    ports:
      # 로컬 확인용. 같은 기기에서만 열린다. 외부 접속은 cloudflared로만 한다.
      - "127.0.0.1:8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick Tunnel: 주소는 `docker compose logs cloudflared`에서 확인. 재시작하면 바뀐다.
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
