{% extends "base.html" %}
{% from "_macros.html" import csrf, person_fields %}
{% block title %}{{ person.name }} 수정 · 우리 가계도{% endblock %}
{% block content %}
<h1>{{ person.name }} 정보 수정</h1>
<form method="post" class="stack">
  {{ csrf() }}
  {{ person_fields(form) }}
  <button type="submit">저장</button>
</form>
<p><a href="{{ url_for('people.detail', pid=person.id) }}">취소</a></p>
{% endblock %}
