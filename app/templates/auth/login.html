{% extends "base.html" %}
{% block title %}로그인 · 우리 가계도{% endblock %}
{% block content %}
<h1>로그인</h1>
<form method="post" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>이름
    <input name="name" value="{{ form.get('name', '') }}" required autocomplete="name">
  </label>
  <label>생년월일 8자리
    <input name="birth_date" value="{{ form.get('birth_date', '') }}" inputmode="numeric" maxlength="10" placeholder="19850312" required>
  </label>
  <label>PIN
    <input name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required>
  </label>
  <button type="submit">로그인</button>
</form>
<p><a href="{{ url_for('auth.signup') }}">처음이에요 (가입)</a></p>
{% endblock %}
